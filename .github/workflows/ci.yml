name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          # The narration engine uses onnxruntime's bundled CPU runtime; its install script would fetch CUDA files.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
