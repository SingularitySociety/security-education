name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  VIDEOS_RELEASE_TAG: videos

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile
        env:
          # The narration engine uses onnxruntime's bundled CPU runtime; its install script would fetch CUDA files.
          ONNXRUNTIME_NODE_INSTALL: skip
      # Narration needs macOS `say`, so videos are rendered locally and attached to a release.
      - run: gh release download "$VIDEOS_RELEASE_TAG" --pattern "*.mp4" --dir packages/web/public/videos
        env:
          GH_TOKEN: ${{ github.token }}
      - run: yarn build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
